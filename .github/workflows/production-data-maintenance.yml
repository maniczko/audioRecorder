name: Production Data Maintenance

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the repair plan. Keep false for dry-run.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      workspace_id:
        description: 'Optional workspace id override. Empty uses PRODUCTION_SMOKE_WORKSPACE_ID.'
        required: false
        default: ''
      run_restore_verification:
        description: 'Run staging/sandbox backup restore verification.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      restore_workspace_id:
        description: 'Optional restored staging workspace id. Empty uses RESTORE_VERIFY_WORKSPACE_ID.'
        required: false
        default: ''
      restore_environment:
        description: 'Restore verification target environment.'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'sandbox'
      backup_id:
        description: 'Backup identifier to include in restore verification report.'
        required: false
        default: ''
      restore_id:
        description: 'Restore identifier to include in restore verification report.'
        required: false
        default: ''
      expected_recording_ids:
        description: 'Comma-separated restored recording ids to verify.'
        required: false
        default: ''

concurrency:
  group: production-data-maintenance
  cancel-in-progress: false

jobs:
  repair-workspace-consistency:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_SMOKE_WORKSPACE_ID: ${{ secrets.PRODUCTION_SMOKE_WORKSPACE_ID }}
      WORKSPACE_ID: ${{ inputs.workspace_id }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-profile: pure-js

      - name: Validate maintenance secrets
        shell: bash
        run: |
          missing=()
          for secret in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [[ -n "${!secret}" ]] || missing+=("${secret}")
          done

          if [[ -z "${WORKSPACE_ID}" && -z "${PRODUCTION_SMOKE_WORKSPACE_ID}" ]]; then
            missing+=("WORKSPACE_ID or PRODUCTION_SMOKE_WORKSPACE_ID")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "## Missing production maintenance secrets" >> "$GITHUB_STEP_SUMMARY"
            for secret in "${missing[@]}"; do
              echo "- ${secret}" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Missing required secret: ${secret}"
            done
            exit 1
          fi

      - name: Dry-run workspace consistency repair
        if: ${{ inputs.apply != 'true' }}
        run: pnpm run repair:supabase:workspace

      - name: Apply workspace consistency repair
        if: ${{ inputs.apply == 'true' }}
        run: pnpm run repair:supabase:workspace -- --apply

      - name: Verify workspace consistency after repair
        if: ${{ inputs.apply == 'true' }}
        run: pnpm run verify:supabase:workspace

      - name: Upload maintenance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-data-maintenance-reports
          path: |
            reports/supabase-workspace-repair/
            reports/supabase-workspace-consistency/
          if-no-files-found: ignore

  backup-restore-verification:
    if: ${{ github.event_name == 'schedule' || inputs.run_restore_verification == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      WORKSPACE_ID: ${{ inputs.restore_workspace_id || secrets.RESTORE_VERIFY_WORKSPACE_ID }}
      RESTORE_VERIFY_ENVIRONMENT: ${{ inputs.restore_environment || 'staging' }}
      RESTORE_VERIFY_EXPECTED_RECORDING_IDS: ${{ inputs.expected_recording_ids || secrets.RESTORE_VERIFY_EXPECTED_RECORDING_IDS }}
      RESTORE_VERIFY_BACKUP_ID: ${{ inputs.backup_id || secrets.RESTORE_VERIFY_BACKUP_ID }}
      RESTORE_VERIFY_RESTORE_ID: ${{ inputs.restore_id || secrets.RESTORE_VERIFY_RESTORE_ID }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.RESTORE_VERIFY_STORAGE_BUCKET || 'recordings' }}
      RESTORE_VERIFY_REFERENCE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-profile: pure-js

      - name: Validate restore verification secrets
        shell: bash
        run: |
          missing=()
          for secret in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY WORKSPACE_ID; do
            [[ -n "${!secret}" ]] || missing+=("${secret}")
          done
          [[ -n "${RESTORE_VERIFY_REFERENCE_URL}" ]] || missing+=("RESTORE_VERIFY_REFERENCE_URL")

          if [ "${RESTORE_VERIFY_ENVIRONMENT}" = "production" ]; then
            missing+=("RESTORE_VERIFY_ENVIRONMENT must be staging or sandbox")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "## Missing backup restore verification secrets" >> "$GITHUB_STEP_SUMMARY"
            for secret in "${missing[@]}"; do
              echo "- ${secret}" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Missing required restore verification setting: ${secret}"
            done
            exit 1
          fi

          if [ "${RESTORE_VERIFY_REFERENCE_URL%/}" = "${SUPABASE_URL%/}" ]; then
            echo "## Restore reference misconfiguration" >> "$GITHUB_STEP_SUMMARY"
            echo "- Restore verification target and reference Supabase project URLs are identical." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::RESTORE_VERIFY_REFERENCE_URL must point to a different project than SUPABASE_URL."
            exit 1
          fi

      - name: Verify restored staging workspace
        run: pnpm run verify:backup-restore

      - name: Upload restore verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-verification-report
          path: reports/backup-restore-verification/
          if-no-files-found: ignore
