name: Railway Sync Database URL

on:
  workflow_dispatch:

jobs:
  sync-database-url:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate required secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          VOICELOG_DATABASE_URL: ${{ secrets.VOICELOG_DATABASE_URL }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_SERVICE_ID"
          test -n "$VOICELOG_DATABASE_URL"
          case "$VOICELOG_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "VOICELOG_DATABASE_URL must be a postgres URL" >&2; exit 1 ;;
          esac

      - name: Set Railway VOICELOG_DATABASE_URL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 6c73db42-8183-4e3b-b546-5edaa616cfe4
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          VOICELOG_DATABASE_URL: ${{ secrets.VOICELOG_DATABASE_URL }}
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$RAILWAY_SERVICE_ID" \
            || true
          printf '%s' "$VOICELOG_DATABASE_URL" | railway variable set \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --stdin \
            VOICELOG_DATABASE_URL
          printf '%s' "$VOICELOG_DATABASE_URL" | railway variable set \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --stdin \
            DATABASE_URL

      - name: Verify Railway variable names
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          railway variable list \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --json \
            | node -e "let data='';process.stdin.on('data',d=>data+=d);process.stdin.on('end',()=>{const parsed=JSON.parse(data);const keys=Array.isArray(parsed)?parsed.map(v=>v.name||v.key):Object.keys(parsed);for (const key of keys.sort()) console.log(key);if(!keys.includes('VOICELOG_DATABASE_URL')) process.exit(1);if(!keys.includes('DATABASE_URL')) process.exit(1);});"

      - name: Deploy Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 6c73db42-8183-4e3b-b546-5edaa616cfe4
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$RAILWAY_SERVICE_ID" \
            --message "Sync database URL from GitHub secret"

      - name: Print Railway deployment status
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          railway deployment list \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --limit 5 \
            --json
