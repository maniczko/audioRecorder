name: Temporary PR formatter

on:
  push:
    branches:
      - codex/issue-1287-recordings-layout
    paths:
      - src/RecordingsTab.tsx
      - .github/workflows/temp-recordings-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/RecordingsTab.tsx
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RecordingsTab.tsx
          git diff --cached --quiet || git commit -m "style(recordings): format shared layout"
          git push
