name: Task Queue Auto Assign

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  assign-task-owners:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Skip while release workflows are active
        id: release-guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active_count=0
          for workflow in \
            ci.yml \
            railway-build-metadata.yml \
            vercel-production.yml \
            backend-production-smoke.yml \
            production-system-audit.yml; do
            count="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --branch main \
              --status in_progress \
              --json databaseId \
              --jq 'length')"
            echo "$workflow: $count active run(s)"
            active_count=$((active_count + count))
          done

          if [ "$active_count" -gt 0 ]; then
            echo "Release workflows are active; skipping task queue mutation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.release-guard.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.release-guard.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - if: steps.release-guard.outputs.skip != 'true'
        run: corepack enable

      - name: Assign owners to new TASK_QUEUE items
        if: steps.release-guard.outputs.skip != 'true'
        run: node scripts/assign-task-agents.mjs

      - name: Dispatch assigned tasks
        if: steps.release-guard.outputs.skip != 'true'
        env:
          TASK_RUNNER_ONCE: 'true'
          TASK_AGENT_CODEX_WEBHOOK_URL: ${{ secrets.TASK_AGENT_CODEX_WEBHOOK_URL }}
          TASK_AGENT_QWEN_WEBHOOK_URL: ${{ secrets.TASK_AGENT_QWEN_WEBHOOK_URL }}
          TASK_AGENT_CODEX_COMMAND: ${{ vars.TASK_AGENT_CODEX_COMMAND }}
          TASK_AGENT_QWEN_COMMAND: ${{ vars.TASK_AGENT_QWEN_COMMAND }}
          TASK_RUNNER_COMMAND_TIMEOUT_MS: ${{ vars.TASK_RUNNER_COMMAND_TIMEOUT_MS || '900000' }}
        run: node scripts/task-agent-runner.mjs

      - name: Commit TASK_QUEUE.md update
        if: steps.release-guard.outputs.skip != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet docs/automation/TASK_QUEUE.md && echo "No changes" && exit 0
          git add docs/automation/TASK_QUEUE.md
          git commit -m "chore: auto-assign task queue owners"
          git push origin HEAD:${{ github.ref_name || 'main' }}
