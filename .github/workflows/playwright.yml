name: E2E Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI: true
  PLAYWRIGHT_BROWSERS_PATH: /tmp/browsers

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E Playwright Tests
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release E2E checks
        id: tests
        run: |
          pnpm exec playwright test \
            tests/e2e/smoke.spec.js \
            tests/e2e/advanced-journeys.spec.js \
            tests/e2e/command-palette.spec.js \
            --reporter=list,html,junit \
            --retries=2 \
            --workers=2
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
          PLAYWRIGHT_HTML_OUTPUT: playwright-report

      - name: Run remote API workspace contract
        run: pnpm run test:e2e:remote-api

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            results.xml
          retention-days: 7
