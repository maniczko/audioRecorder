name: Production Deployment (Vercel)

# Trigger only after Railway exposes the same SHA; never deploy a frontend
# against a stale production backend.
on:
  workflow_run:
    workflows: ['Railway Build Metadata']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  vercel-production:
    runs-on: ubuntu-latest
    name: Deploy Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PNPM_HOME: /home/runner/.local/share/pnpm
    # Skip if triggered by a failed CI run (workflow_dispatch always runs)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy the exact SHA that CI tested, not whatever is on main at deploy time
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate Vercel secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${VERCEL_TOKEN}" ]] || missing+=("VERCEL_TOKEN")
          [[ -n "${VERCEL_ORG_ID}" ]] || missing+=("VERCEL_ORG_ID")
          [[ -n "${VERCEL_PROJECT_ID}" ]] || missing+=("VERCEL_PROJECT_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "## Missing Vercel secrets" >> "$GITHUB_STEP_SUMMARY"
            for secret in "${missing[@]}"; do
              echo "- Missing GitHub Actions secret: ${secret}" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Missing GitHub Actions secret: ${secret}"
            done
            exit 1
          fi

      - name: Pull Vercel Production Environment Information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        env:
          VITE_BUILD_ID: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel Production
        id: vercel_deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "production_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Production smoke
        env:
          PRODUCTION_FRONTEND_URL: ${{ steps.vercel_deploy.outputs.production_url }}
          PRODUCTION_API_BASE_URL: ${{ steps.vercel_deploy.outputs.production_url }}
          PRODUCTION_REQUIRE_SUPABASE_REMOTE: 'true'
          PRODUCTION_REQUIRE_KNOWN_GIT_SHA: 'true'
          PRODUCTION_REQUIRE_SENTRY_DSN: 'true'
          PRODUCTION_REQUIRE_AUDIO_UPLOAD_SMOKE: 'true'
          PRODUCTION_REQUIRE_STALE_RECORDING_SMOKE: 'true'
          PRODUCTION_REQUIRE_VOICE_PROFILE_SMOKE: 'true'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_SMOKE_AUTH_TOKEN: ${{ secrets.PRODUCTION_SMOKE_AUTH_TOKEN }}
          PRODUCTION_SMOKE_WORKSPACE_ID: ${{ secrets.PRODUCTION_SMOKE_WORKSPACE_ID }}
          PRODUCTION_SMOKE_MEETING_ID: ${{ secrets.PRODUCTION_SMOKE_MEETING_ID }}
          PRODUCTION_SMOKE_STALE_RECORDING_ID: ${{ secrets.PRODUCTION_SMOKE_STALE_RECORDING_ID }}
          PRODUCTION_SMOKE_VOICE_PROFILE_RECORDING_ID: ${{ secrets.PRODUCTION_SMOKE_VOICE_PROFILE_RECORDING_ID }}
          PRODUCTION_SMOKE_VOICE_PROFILE_SPEAKER_ID: ${{ secrets.PRODUCTION_SMOKE_VOICE_PROFILE_SPEAKER_ID }}
          PRODUCTION_SMOKE_VOICE_PROFILE_SPEAKER_NAME: ${{ secrets.PRODUCTION_SMOKE_VOICE_PROFILE_SPEAKER_NAME }}
          PRODUCTION_PERSISTENCE_EVIDENCE_URL: ${{ secrets.PRODUCTION_PERSISTENCE_EVIDENCE_URL }}
        run: pnpm run release:prod-smoke:strict

      - name: Sentry release health
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          SENTRY_ENVIRONMENT: production
          SENTRY_WINDOW_MINUTES: '20'
          SENTRY_WARNING_THRESHOLD: '5'
        run: pnpm run sentry:release-health

      - name: Publish deployment summary
        run: |
          echo "## Vercel Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: ${{ steps.vercel_deploy.outputs.production_url }}" >> $GITHUB_STEP_SUMMARY
