name: Bundle Size Monitor

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout code for target event
        uses: actions/checkout@v6
        if: github.event_name == 'pull_request_target'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Check compressed bundle size
        id: compressed-size
        continue-on-error: true
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: './build/**/*.{js,css}'
          exclude: '**/*.map,**/*.svg,**/*.png,**/*.jpg'
          minimum-change-threshold: '1KB'
          build-script: 'build'

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-bundle
          path: build/
          retention-days: 7

      - name: Comment on PR with bundle size
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const distDir = path.join(process.cwd(), 'build');
            let totalSize = 0;
            let jsSize = 0;
            let cssSize = 0;

            function calculateSize(dir) {
              if (!fs.existsSync(dir)) return;
              const files = fs.readdirSync(dir);

              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);

                if (stat.isDirectory()) {
                  calculateSize(filePath);
                } else if (file.endsWith('.js')) {
                  jsSize += stat.size;
                  totalSize += stat.size;
                } else if (file.endsWith('.css')) {
                  cssSize += stat.size;
                  totalSize += stat.size;
                }
              }
            }

            calculateSize(distDir);

            function formatSize(bytes) {
              if (bytes < 1024) return `${bytes} B`;
              if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(2)} KB`;
              return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            }

            const compressedOutcome = '${{ steps.compressed-size.outcome }}';
            let comment = '## Bundle Size Report\n\n';
            comment += '### Build Artifacts\n\n';
            comment += '| Type | Size |\n';
            comment += '|------|------|\n';
            comment += `| JavaScript | ${formatSize(jsSize)} |\n`;
            comment += `| CSS | ${formatSize(cssSize)} |\n`;
            comment += `| Total | ${formatSize(totalSize)} |\n\n`;
            comment += `Compressed-size check outcome: ${compressedOutcome}\n\n`;

            if (compressedOutcome !== 'success') {
              comment += 'The compressed-size action did not complete successfully. This workflow keeps the bundle report advisory so it does not block unrelated GitHub configuration changes.\n\n';
            }

            comment += '---\nThis is an automated report from Bundle Size Monitor.\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find((c) => c.body.includes('Bundle Size Report'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
