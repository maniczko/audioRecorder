name: Bundle Size Monitor

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout code (dependabot)
        uses: actions/checkout@v7
        if: github.event_name == 'pull_request_target'
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-profile: native

      - name: Check bundle size
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: './build/**/*.{js,css}'
          exclude: '**/*.map,**/*.svg,**/*.png,**/*.jpg'
          minimum-change-threshold: '1KB'
          build-script: 'pnpm run build'

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-bundle
          path: build/
          retention-days: 7

      - name: Comment on PR with bundle size
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Calculate bundle sizes
            const distDir = path.join(process.cwd(), 'build');
            let totalSize = 0;
            let jsSize = 0;
            let cssSize = 0;

            function calculateSize(dir) {
              const files = fs.readdirSync(dir);

              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);

                if (stat.isDirectory()) {
                  calculateSize(filePath);
                } else if (file.endsWith('.js')) {
                  jsSize += stat.size;
                  totalSize += stat.size;
                } else if (file.endsWith('.css')) {
                  cssSize += stat.size;
                  totalSize += stat.size;
                }
              }
            }

            calculateSize(distDir);

            function formatSize(bytes) {
              if (bytes < 1024) return `${bytes} B`;
              if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(2)} KB`;
              return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
            }



            let comment = '## Bundle Size Report\n\n';
            comment += '### Build Artifacts\n\n';
            comment += `| Type | Size |\n`;
            comment += `|------|------|\n`;
            comment += `| JavaScript | ${formatSize(jsSize)} |\n`;
            comment += `| CSS | ${formatSize(cssSize)} |\n`;
            comment += `| **Total** | **${formatSize(totalSize)}** |\n\n`;

            if (github.event_name === 'pull_request') {
              comment += '### Changes\n\n';

              if (totalSize > 500 * 1024) {
                comment += '**Warning:** Bundle size is over 500KB\n\n';
              }

              if (totalSize > 1024 * 1024) {
                comment += '**Critical:** Bundle size is over 1MB\n\n';
              }
            }

            comment += '### Recommendations\n\n';
            comment += '- Keep bundle size under 500KB for optimal performance\n';
            comment += '- Use code splitting for large features\n';
            comment += '- Tree-shake unused dependencies\n';
            comment += '- Compress assets with gzip/brotli\n\n';

            comment += '---\nThis is an automated report from Bundle Size Monitor.\n';

            // Delete existing comment if exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find((c) => c.body.includes('Bundle Size Report'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      # compressed-size-action checks out main to compare bundle output. Restore
      # the PR tree so the post step of the local setup action can load action.yml.
      - name: Restore pull request checkout for action cleanup
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
