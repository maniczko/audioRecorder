name: Temporary auth recovery formatter

on:
  push:
    branches:
      - codex/issue-1279-auth-recovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-1279-auth-recovery
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/components/RecordingPipelineStatus.tsx src/store/recorderQueueProcessor.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RecordingPipelineStatus.tsx src/store/recorderQueueProcessor.ts
          git commit -m "style: format auth recovery changes"
          git push
