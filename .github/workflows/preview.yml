name: Preview Deployment (Vercel)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Deploy Preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate Vercel secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${VERCEL_TOKEN}" ]] || missing+=("VERCEL_TOKEN")
          [[ -n "${VERCEL_ORG_ID}" ]] || missing+=("VERCEL_ORG_ID")
          [[ -n "${VERCEL_PROJECT_ID}" ]] || missing+=("VERCEL_PROJECT_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "## Missing Vercel secrets" >> "$GITHUB_STEP_SUMMARY"
            for secret in "${missing[@]}"; do
              echo "- Missing GitHub Actions secret: ${secret}" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Missing GitHub Actions secret: ${secret}"
            done
            exit 1
          fi

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        id: vercel_deploy
        shell: bash
        run: |
          set +e
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" 2>&1)
          DEPLOY_STATUS=$?
          set -e

          echo "$DEPLOY_OUTPUT"

          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            if echo "$DEPLOY_OUTPUT" | grep -q 'api-deployments-free-per-day'; then
              echo "preview_skipped=true" >> "$GITHUB_OUTPUT"
              {
                echo "## Vercel preview skipped"
                echo ""
                echo "Vercel returned \`api-deployments-free-per-day\`. The GitHub App deployment status remains the authoritative preview signal for this PR."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            exit "$DEPLOY_STATUS"
          fi

          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)
          echo "preview_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request' && steps.vercel_deploy.outputs.preview_url != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview URL: ${'${{ steps.vercel_deploy.outputs.preview_url }}'}`
            })
