name: Railway Build Metadata

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-build-metadata-production
  cancel-in-progress: true

jobs:
  sync-build-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate required secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_SERVICE_ID"

      - name: Set Railway build metadata variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 6c73db42-8183-4e3b-b546-5edaa616cfe4
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$RAILWAY_SERVICE_ID" \
            || true
          railway status || true

          set_railway_variable_with_retry() {
            name="$1"
            value="$2"

            for attempt in 1 2 3; do
              echo "Railway variable set attempt $attempt/3 for $name"
              if printf '%s' "$value" | railway variable set \
                --service "$RAILWAY_SERVICE_ID" \
                --environment production \
                --skip-deploys \
                --stdin \
                "$name"; then
                return 0
              fi

              if [ "$attempt" = "3" ]; then
                echo "Railway variable set failed after 3 attempts for $name" >&2
                return 1
              fi

              sleep $((attempt * 10))
            done
          }

          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set_railway_variable_with_retry RAILWAY_GIT_COMMIT_SHA "$BUILD_SHA"
          set_railway_variable_with_retry GITHUB_SHA "$BUILD_SHA"
          set_railway_variable_with_retry APP_BUILD_TIME "$build_time"

      - name: Deploy Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 6c73db42-8183-4e3b-b546-5edaa616cfe4
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Railway deploy attempt $attempt/3"
            if railway up \
              --ci \
              --detach \
              --project "$RAILWAY_PROJECT_ID" \
              --environment production \
              --service "$RAILWAY_SERVICE_ID" \
              --message "Sync build metadata from GitHub Actions"; then
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "Railway deploy failed after 3 attempts" >&2
              exit 1
            fi

            sleep $((attempt * 20))
          done
          railway deployment list \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            || true

      - name: Verify production health git SHA
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 6c73db42-8183-4e3b-b546-5edaa616cfe4
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          dump_railway_diagnostics() {
            echo "::group::Railway deployment diagnostics"
            railway deployment list \
              --service "$RAILWAY_SERVICE_ID" \
              --environment production \
              || true
            railway logs \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment production \
              --latest \
              --deployment \
              --lines 120 \
              || true
            railway logs \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment production \
              --latest \
              --lines 200 \
              --filter "@level:error OR @level:warn" \
              || true
            railway logs \
              --project "$RAILWAY_PROJECT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --environment production \
              --latest \
              --http \
              --status ">=500" \
              --lines 50 \
              || true
            echo "::endgroup::"
          }

          last_http_status="unknown"
          for attempt in $(seq 1 60); do
            echo "Health check attempt $attempt"
            body_file="$(mktemp)"
            http_status="$(
              curl \
                -sS \
                --max-time 20 \
                -o "$body_file" \
                -w "%{http_code}" \
                https://audiorecorder-production.up.railway.app/health \
                || true
            )"
            payload="$(cat "$body_file" || true)"
            rm -f "$body_file"
            last_http_status="${http_status:-curl_failed}"
            echo "Railway health HTTP status: $last_http_status"
            echo "$payload" | HTTP_STATUS="$last_http_status" node -e "let data='';process.stdin.on('data',d=>data+=d);process.stdin.on('end',()=>{try{const json=JSON.parse(data);console.log(JSON.stringify({ok:json.ok,status:json.status,gitSha:json.gitSha,runtime:json.runtime,supabaseRemote:json.supabaseRemote}));process.exit(process.env.HTTP_STATUS==='200'&&json.gitSha===process.env.EXPECTED_SHA?0:2)}catch{if(data.trim())console.log(data.slice(0,500));process.exit(2)}});" && exit 0
            sleep 10
          done
          echo "Railway health did not expose expected git SHA after 60 attempts (last HTTP status: $last_http_status)" >&2
          dump_railway_diagnostics
          exit 1
