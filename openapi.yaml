openapi: '3.0.3'
info:
  title: VoiceLog API
  description: |
    VoiceLog is an AI-powered meeting assistant that transcribes audio,
    extracts action items, and provides meeting intelligence.

    This API provides endpoints for:
    - Audio upload and transcription
    - Meeting management
    - Voice profiles for speaker identification
    - State synchronization
    - AI-powered analysis
  version: '1.0.0'
  contact:
    name: VoiceLog Team
    url: https://github.com/voicelog

servers:
  - url: http://localhost:4000
    description: Local development server
  - url: https://voicelog.example.com
    description: Production server

tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Media
    description: Audio upload and transcription
  - name: Voice Profiles
    description: Speaker voice profiles for identification
  - name: State
    description: Workspace state synchronization
  - name: Client Errors
    description: Frontend error reporting
  - name: Digest
    description: Email digest notifications
  - name: AI
    description: AI proxy endpoints with validated request contracts

security:
  - BearerAuth: []

paths:
  # ─────────────────────────────────────────────────────────────────────────────
  # Health
  # ─────────────────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns server health status including database connectivity
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: string
                    enum: [ok, degraded]
                  db:
                    type: string
                  supabaseRemote:
                    type: boolean
                  uptime:
                    type: integer
                  memory:
                    type: object
                    properties:
                      heapUsed:
                        type: string
                      rss:
                        type: string

  # ─────────────────────────────────────────────────────────────────────────────
  # Authentication
  # ─────────────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                workspaceId:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid request body

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                workspaceId:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  error:
                    type: string

  /auth/session:
    get:
      tags: [Authentication]
      summary: Get current session
      parameters:
        - in: query
          name: workspaceId
          schema:
            type: string
      responses:
        '200':
          description: Session data
        '401':
          description: Missing or invalid token

  /auth/google:
    post:
      tags: [Authentication]
      summary: Login or register with Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [googleId, email, name]
              properties:
                googleId:
                  type: string
                email:
                  type: string
                  format: email
                name:
                  type: string
                picture:
                  type: string
      responses:
        '200':
          description: Google auth successful

  /auth/password/reset/request:
    post:
      tags: [Authentication]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset code sent

  /auth/password/reset/confirm:
    post:
      tags: [Authentication]
      summary: Confirm password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password reset successful

  # ─────────────────────────────────────────────────────────────────────────────
  # Media
  # ─────────────────────────────────────────────────────────────────────────────
  /media/recordings/{recordingId}/audio:
    put:
      tags: [Media]
      summary: Upload recording audio
      description: |
        Uses recordingId as the natural idempotency key. Retrying the same
        upload for an existing recording returns the current media asset instead
        of writing another object. Idempotency-Key is optional and is echoed when
        supplied so clients can correlate retry attempts.
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 160
          description: Optional retry correlation key; recordingId remains authoritative.
      requestBody:
        required: true
        content:
          audio/*:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Audio uploaded or existing upload returned idempotently
          content:
            application/json:
              schema:
                type: object
                required: [id, workspaceId, sizeBytes, idempotent, idempotencyScope]
                properties:
                  id:
                    type: string
                  workspaceId:
                    type: string
                  sizeBytes:
                    type: integer
                  storageMode:
                    type: string
                    enum: [single, segmented]
                  sourceSizeBytes:
                    type: integer
                  normalizedSizeBytes:
                    type: integer
                  audioValidation:
                    nullable: true
                  audioQuality:
                    nullable: true
                  idempotent:
                    type: boolean
                    description: True when the response returned an already existing asset.
                  idempotencyKey:
                    type: string
                    nullable: true
                  idempotencyScope:
                    type: string
                    example: recordingId
        '400':
          description: Missing workspace header
        '413':
          description: Audio too large

  /media/recordings/{recordingId}/audio/chunk:
    put:
      tags: [Media]
      summary: Upload named audio chunk
      description: |
        Stores a numbered chunk for chunked upload. When Idempotency-Key is
        supplied and the same chunk index already exists, the server returns the
        existing chunk position without overwriting stored bytes.
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
        - in: query
          name: index
          required: true
          schema:
            type: integer
            minimum: 0
        - in: query
          name: total
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 600
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 160
      responses:
        '200':
          description: Chunk saved or existing chunk returned idempotently
          content:
            application/json:
              schema:
                type: object
                required: [index, total, idempotent, idempotencyScope]
                properties:
                  index:
                    type: integer
                  total:
                    type: integer
                  idempotent:
                    type: boolean
                  idempotencyKey:
                    type: string
                    nullable: true
                  idempotencyScope:
                    type: string
                    example: recordingId:chunkIndex
        '400':
          description: Invalid parameters
        '413':
          description: Chunk too large

  /media/recordings/{recordingId}/audio/finalize:
    post:
      tags: [Media]
      summary: Finalize audio recording
      description: |
        Assembles chunks and creates the media asset. If the asset already
        exists for the same workspace, finalize is retry-safe and returns the
        existing asset without reassembling or rewriting media.
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, total]
              properties:
                workspaceId:
                  type: string
                meetingId:
                  type: string
                contentType:
                  $ref: '#/components/schemas/AudioContentType'
                total:
                  type: integer
                  minimum: 1
                  maximum: 600
      responses:
        '200':
          description: Recording finalized or existing asset returned idempotently
          content:
            application/json:
              schema:
                type: object
                required: [id, workspaceId, sizeBytes, idempotent, idempotencyScope]
                properties:
                  id:
                    type: string
                  workspaceId:
                    type: string
                  sizeBytes:
                    type: integer
                  storageMode:
                    type: string
                    enum: [single, segmented]
                  partCount:
                    type: integer
                  sourceSizeBytes:
                    type: integer
                  normalizedSizeBytes:
                    type: integer
                  durationMs:
                    type: integer
                  audioValidation:
                    nullable: true
                  audioQuality:
                    nullable: true
                  idempotent:
                    type: boolean
                  idempotencyKey:
                    type: string
                    nullable: true
                  idempotencyScope:
                    type: string
                    example: recordingId
        '400':
          description: Missing workspace ID
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /media/recordings/{recordingId}/transcribe:
    post:
      tags: [Media]
      summary: Queue transcription job
      description: |
        Starts transcription for uploaded audio. If a recording is already
        processing or diarizing, or a queued durable job is active, the endpoint
        returns the current status with idempotent=true instead of duplicating work.
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId:
                  type: string
                processingMode:
                  $ref: '#/components/schemas/ProcessingMode'
      responses:
        '202':
          description: Transcription queued or active job returned idempotently
          content:
            application/json:
              schema:
                type: object
                required: [recordingId, pipelineStatus, idempotent, idempotencyScope]
                properties:
                  recordingId:
                    type: string
                  pipelineStatus:
                    type: string
                  idempotent:
                    type: boolean
                  idempotencyKey:
                    type: string
                    nullable: true
                  idempotencyScope:
                    type: string
                    example: recordingId
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    get:
      tags: [Media]
      summary: Get transcription status/result
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transcription data

  /media/recordings/{recordingId}/retry-transcribe:
    post:
      tags: [Media]
      summary: Retry failed transcription
      description: |
        Retry is safe for failed or empty completed transcriptions. Retrying an
        active job returns the current status instead of duplicating work.
        Retrying an already completed non-empty transcription returns 409 unless
        the request explicitly sets force=true.
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            maxLength: 160
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Required to retry an already completed non-empty transcription.
                processingMode:
                  $ref: '#/components/schemas/ProcessingMode'
      responses:
        '202':
          description: Retry queued or active job returned idempotently
          content:
            application/json:
              schema:
                type: object
                required: [recordingId, pipelineStatus, idempotent, idempotencyScope]
                properties:
                  recordingId:
                    type: string
                  pipelineStatus:
                    type: string
                  idempotent:
                    type: boolean
                  idempotencyKey:
                    type: string
                    nullable: true
                  idempotencyScope:
                    type: string
                    example: recordingId
        '409':
          description: Transcription is already completed and force=true is required.
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /media/recordings/{recordingId}/sketchnote:
    post:
      tags: [Media]
      summary: Generate visual sketchnote
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sketchnote URL
        '429':
          description: Rate limited
        '503':
          description: AI service unavailable

  /media/recordings/{recordingId}/normalize:
    post:
      tags: [Media]
      summary: Normalize audio
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Normalized audio path

  /media/recordings/{recordingId}/voice-coaching:
    post:
      tags: [Media]
      summary: Generate voice coaching feedback
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceCoachingRequest'
      responses:
        '200':
          description: Voice coaching text
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /media/recordings/{recordingId}/acoustic-features:
    post:
      tags: [Media]
      summary: Extract acoustic features
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Acoustic features data

  /media/recordings/{recordingId}/voice-profiles/from-speaker:
    post:
      tags: [Media]
      summary: Create voice profile from speaker audio
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceProfileFromSpeakerRequest'
      responses:
        '201':
          description: Voice profile created
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /media/recordings/{recordingId}/rediarize:
    post:
      tags: [Media]
      summary: Re-run diarization
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rediarization complete
        '422':
          description: Diarization failed

  /media/analyze:
    post:
      tags: [Media]
      summary: Analyze meeting transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeRequest'
      responses:
        '200':
          description: Analysis result
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /media/recordings/{recordingId}:
    delete:
      tags: [Media]
      summary: Delete recording
      parameters:
        - in: path
          name: recordingId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '403':
          description: No workspace access

  # ─────────────────────────────────────────────────────────────────────────────
  # Transcription (Live)
  # ─────────────────────────────────────────────────────────────────────────────
  /transcribe/live:
    post:
      tags: [Media]
      summary: Live transcription of audio chunk
      requestBody:
        required: true
        content:
          audio/*:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Transcription text
        '401':
          description: Unauthorized
        '413':
          description: Payload too large
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # ─────────────────────────────────────────────────────────────────────────────
  # Voice Profiles
  # ─────────────────────────────────────────────────────────────────────────────
  /voice-profiles:
    get:
      tags: [Voice Profiles]
      summary: List voice profiles for workspace
      responses:
        '200':
          description: List of voice profiles
        '401':
          description: Unauthorized

    post:
      tags: [Voice Profiles]
      summary: Create voice profile
      parameters:
        - in: header
          name: X-Speaker-Name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Profile created
        '400':
          description: Missing X-Speaker-Name header

  /voice-profiles/{id}/threshold:
    patch:
      tags: [Voice Profiles]
      summary: Update voice profile threshold
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threshold:
                  type: number
                  minimum: 0
                  maximum: 1
      responses:
        '200':
          description: Threshold updated

  /voice-profiles/{id}:
    delete:
      tags: [Voice Profiles]
      summary: Delete voice profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  # ─────────────────────────────────────────────────────────────────────────────
  # State
  # ─────────────────────────────────────────────────────────────────────────────
  /state/bootstrap:
    get:
      tags: [State]
      summary: Get full workspace bootstrap state
      responses:
        '200':
          description: Bootstrap data
        '401':
          description: Unauthorized

  /state/workspaces/{workspaceId}:
    put:
      tags: [State]
      summary: Update workspace state
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: State updated
        '401':
          description: Unauthorized

    patch:
      tags: [State]
      summary: Delta update workspace state
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: State updated
        '401':
          description: Unauthorized

  # ─────────────────────────────────────────────────────────────────────────────
  # Client Errors
  # ─────────────────────────────────────────────────────────────────────────────
  /api/client-errors:
    post:
      tags: [Client Errors]
      summary: Report frontend errors
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ClientError'
                - type: array
                  items:
                    $ref: '#/components/schemas/ClientError'
      responses:
        '200':
          description: Errors received
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  received:
                    type: integer
        '400':
          description: Too many errors (>50 per request)

    get:
      tags: [Client Errors]
      summary: Get stored client errors
      security: []
      responses:
        '200':
          description: Stored errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientError'

    delete:
      tags: [Client Errors]
      summary: Clear all stored client errors
      security: []
      responses:
        '200':
          description: Errors cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  cleared:
                    type: boolean

  # ─────────────────────────────────────────────────────────────────────────────
  # Digest
  # ─────────────────────────────────────────────────────────────────────────────
  /digest/daily:
    get:
      tags: [Digest]
      summary: Get daily digest preview
      responses:
        '200':
          description: Digest data

    post:
      tags: [Digest]
      summary: Send daily digest email
      responses:
        '200':
          description: Digest sent

  /ai/person-profile:
    post:
      tags: [AI]
      summary: Generate AI person profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiPersonProfileRequest'
      responses:
        '200':
          description: Profile analysis or no-key fallback
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /ai/suggest-tasks:
    post:
      tags: [AI]
      summary: Suggest tasks from transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSuggestTasksRequest'
      responses:
        '200':
          description: Suggested tasks or empty fallback
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /ai/search:
    post:
      tags: [AI]
      summary: Semantic command search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSearchRequest'
      responses:
        '200':
          description: Search matches or no-key fallback
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

# ─────────────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ValidationError:
      type: object
      required: [code, message, stage, details]
      properties:
        code:
          type: string
          enum: [validation_failed]
        message:
          type: string
        stage:
          type: string
          enum: [validation]
        details:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string

    ProcessingMode:
      type: string
      enum: [fast, full]

    AudioContentType:
      type: string
      description: Supported audio content type.
      pattern: '^(audio/|multipart/form-data|video/webm$|application/octet-stream$)'

    TranscriptSegmentInput:
      type: object
      required: [text]
      properties:
        speakerName:
          type: string
          maxLength: 160
        speakerId:
          oneOf:
            - type: string
            - type: integer
              minimum: 0
        text:
          type: string
          minLength: 1
          maxLength: 5000
        meetingTitle:
          type: string
          maxLength: 240

    AiAnalyzeRequest:
      type: object
      properties:
        workspaceId:
          type: string
        meetingId:
          type: string
        recordingId:
          type: string
        meeting:
          type: object
          additionalProperties: true
        segments:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: true

    AiPersonProfileRequest:
      type: object
      required: [personName, allSegments]
      properties:
        workspaceId:
          type: string
        meetingId:
          type: string
        personName:
          type: string
          minLength: 1
          maxLength: 160
        meetings:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        allSegments:
          type: array
          maxItems: 1000
          items:
